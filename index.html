<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b91c1c" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Portal Resmi Pelayanan Surat Permohonan dan Administrasi Terpadu Masyarakat Republik Indonesia. Ajukan permohonan surat kependudukan dan lacak status secara daring."
    />
    <title>Portal Pelayanan Surat Terpadu | Republik Indonesia</title>

    <!-- Inline Critical CSS untuk Instant Paint (FCP & LCP Ultra Fast) -->
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        -webkit-font-smoothing: antialiased;
      }
      .critical-ribbon {
        width: 100%;
        height: 4px;
        display: flex;
      }
      .critical-ribbon-red {
        width: 50%;
        background-color: #e11d48;
      }
      .critical-ribbon-white {
        width: 50%;
        background-color: #ffffff;
      }
      .critical-nav {
        height: 68px;
        background-color: rgba(255, 255, 255, 0.95);
        border-bottom: 1px solid #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
      }
      .critical-hero {
        background: radial-gradient(circle at top, #1e293b 0%, #020617 100%);
        min-height: calc(100vh - 72px);
        min-height: calc(100dvh - 72px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px 16px;
        box-sizing: border-box;
      }
      .critical-h1 {
        font-size: 24px;
        font-weight: 800;
        color: #ffffff;
        margin: 0 0 16px;
        line-height: 1.25;
        max-width: 700px;
      }
      .critical-p {
        font-size: 14px;
        color: #cbd5e1;
        margin: 0 0 24px;
        max-width: 540px;
        line-height: 1.6;
      }
      @media (min-width: 640px) {
        .critical-nav { padding: 0 32px; }
        .critical-h1 { font-size: 36px; }
        .critical-p { font-size: 16px; }
      }
      @media (min-width: 768px) {
        .critical-h1 { font-size: 48px; }
      }
      #startup-loader { position:fixed; inset:0; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; background:#f8fafc; color:#475569; font-family:system-ui,sans-serif; transition:opacity 240ms ease,visibility 240ms ease; }
      #startup-loader.is-ready { opacity:0; visibility:hidden; pointer-events:none; }
      .startup-mark { width:56px; height:56px; display:grid; place-items:center; border-radius:14px; background:#0f172a; color:white; font-size:17px; font-weight:700; letter-spacing:1px; }
      .startup-spinner { width:26px; height:26px; border:3px solid #e2e8f0; border-top-color:#b91c1c; border-radius:50%; animation:startup-spin .8s linear infinite; }
      #startup-loader p { margin:0; font-size:13px; }
      @keyframes startup-spin { to { transform:rotate(360deg); } }
      @media(prefers-reduced-motion:reduce) { #startup-loader { transition:none; } .startup-spinner { animation:none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Aplikasi memerlukan JavaScript untuk berjalan.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
