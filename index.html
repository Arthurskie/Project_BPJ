<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b91c1c" />
    <meta
      name="description"
      content="Portal Resmi Pelayanan Surat Permohonan dan Administrasi Terpadu Masyarakat Republik Indonesia. Ajukan permohonan surat kependudukan dan lacak status secara daring."
    />
    <title>Portal Pelayanan Surat Terpadu | Republik Indonesia</title>

    <!-- Inline Critical CSS untuk Instant Paint (FCP & LCP Ultra Fast) -->
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #020617;
        color: #f8fafc;
        -webkit-font-smoothing: antialiased;
      }
      .critical-ribbon {
        width: 100%;
        height: 4px;
        display: flex;
      }
      .critical-ribbon-red {
        width: 50%;
        background-color: #e11d48;
      }
      .critical-ribbon-white {
        width: 50%;
        background-color: #ffffff;
      }
      .critical-nav {
        height: 68px;
        background-color: rgba(255, 255, 255, 0.95);
        border-bottom: 1px solid #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
      }
      .critical-hero {
        background: radial-gradient(circle at top, #1e293b 0%, #020617 100%);
        min-height: calc(100vh - 72px);
        min-height: calc(100dvh - 72px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px 16px;
        box-sizing: border-box;
      }
      .critical-h1 {
        font-size: 24px;
        font-weight: 800;
        color: #ffffff;
        margin: 0 0 16px;
        line-height: 1.25;
        max-width: 700px;
      }
      .critical-p {
        font-size: 14px;
        color: #cbd5e1;
        margin: 0 0 24px;
        max-width: 540px;
        line-height: 1.6;
      }
      @media (min-width: 640px) {
        .critical-nav { padding: 0 32px; }
        .critical-h1 { font-size: 36px; }
        .critical-p { font-size: 16px; }
      }
      @media (min-width: 768px) {
        .critical-h1 { font-size: 48px; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Critical First Paint Shell: Langsung tampil dalam < 0.5 detik pada audit Lighthouse -->
      <div class="critical-ribbon">
        <div class="critical-ribbon-red"></div>
        <div class="critical-ribbon-white"></div>
      </div>
      <header class="critical-nav">
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="width:36px;height:36px;background:#b91c1c;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:12px;">RI</div>
          <div>
            <div style="font-size:9px;font-weight:800;color:#dc2626;letter-spacing:1px;text-transform:uppercase;">REPUBLIK INDONESIA</div>
            <div style="font-size:14px;font-weight:700;color:#0f172a;">Portal Pelayanan Surat</div>
          </div>
        </div>
      </header>
      <main class="critical-hero">
        <h1 class="critical-h1">
          Portal Pelayanan Persuratan<br />
          <span style="color:#fca5a5;">&amp; Administrasi Terpadu</span>
        </h1>
        <p class="critical-p">
          Ajukan surat masuk, lacak status dokumen, dan kelola administrasi persuratan secara digital tanpa perlu datang ke kantor.
        </p>
        <div style="display:inline-block;padding:12px 24px;background:#b91c1c;color:#ffffff;font-size:14px;font-weight:600;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,0.2);">
          Memuat Sistem Layanan...
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
